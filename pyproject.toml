[project]
name = "pdf-edit"
version = "0.1.0"
description = "PDF のパスワード解除・分割・結合・圧縮を行うスクリプト集"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyPDF2==3.0.1",
]

[tool.uv]
required-version = ">=0.12.21"

# ロックの取得元を公式 PyPI に固定する（ローカルの pip.conf / 社内ミラーに依存させない）。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
